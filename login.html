<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | DRAVEN</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%23b30000%22>D</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="auth-page">    <div class="bg-particles"></div>

    <!-- Preloader -->
    <div class="loader-wrapper">
        <div class="loader">
            <span class="loader-text">DRAVEN</span>
            <div class="loader-bar"></div>
        </div>
    </div>

    <!-- Auth Topbar: Logo + Theme & RTL controls -->
    <div class="auth-brand-bar">
        <a href="index.html" class="auth-brand-logo">
            <i class="fas fa-feather-pointed"></i> DRAVEN
        </a>
        <div class="auth-controls">
            <button class="utility-btn" id="auth-theme-toggle" title="Switch Theme" aria-label="Switch Light/Dark theme">
                <i class="fa-solid fa-circle-half-stroke"></i>
            </button>
            <button class="utility-btn rtl-toggle" id="auth-rtl-toggle" title="Toggle Right-to-Left mode" aria-label="Toggle Right-to-Left mode">
                <i class="fa-solid fa-right-left"></i>
                <span class="rtl-label">RTL</span>
            </button>
        </div>
    </div>

    <main class="auth-main">
        <section class="auth-section">
            <div class="auth-container reveal">
                <div class="auth-card">
                    <div class="auth-header">
                        <h2>Member Access</h2>
                        <p>Enter your credentials to access your session history and premium features.</p>
                    </div>
                    <form class="auth-form" action="index.html">
                        <div class="form-group">
                            <input type="email" placeholder="Email Address" required>
                        </div>
                        <div class="form-group">
                            <input type="password" id="login-password" placeholder="Password" required>
                            <i class="fas fa-eye toggle-password" data-target="login-password"></i>
                        </div>
                        <div class="auth-options">
                            <label class="remember-me">
                                <input type="checkbox"> <span>Remember Me</span>
                            </label>
                            <a href="forgot-password.html" class="forgot-pass">Forgot Password?</a>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Log In</button>

                        <div class="auth-divider">
                            <span>or continue with</span>
                        </div>

                        <div class="social-login-group">
                            <button type="button" class="btn-social" title="Google"><i class="fab fa-google"></i> Google</button>
                            <button type="button" class="btn-social" title="Apple"><i class="fab fa-apple"></i> Apple</button>
                            <button type="button" class="btn-social" title="Facebook"><i class="fab fa-facebook-f"></i> Facebook</button>
                        </div>
                    </form>
                    <div class="auth-footer">
                        <p>Don't have an account? <a href="signup.html">Create one here</a></p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="assets/js/script.js"></script>
</body>

</html>
